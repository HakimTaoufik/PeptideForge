[project]
name = "jepa-protein"
version = "0.1.0"
description = "Conditional peptide generation across eight neural architectures, with saved experiments and evaluation artifacts."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.13.0",
    "iprogress>=0.4",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "marimo>=0.20.4",
    "matplotlib>=3.10.8",
    "nbformat>=4.2.0",
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "plotly>=6.6.0",
    "requests>=2.32.5",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "sentence-transformers>=5.3.0",
    "tqdm>=4.67.3",
    "transformers>=5.3.0",
]

[project.urls]
Repository = "https://github.com/HakimTaoufik/PeptideForge"
Documentation = "https://github.com/HakimTaoufik/PeptideForge#readme"

[project.optional-dependencies]
amd = [
    "torch",
    "torchvision",
    "pytorch-triton-rocm",
]
nvidia = [
    "torch",
    "torchvision",
    "triton",
]

[tool.uv]
prerelease = "allow"
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.1"

[tool.uv.sources]
torch = [{ index = "pytorch-rocm", extra = "amd" }]
torchvision = [{ index = "pytorch-rocm", extra = "amd" }]
pytorch-triton-rocm = [{ index = "pytorch-rocm", extra = "amd" }]
